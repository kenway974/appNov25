events {}

http {
    server {
        listen 8080;
        server_name _;

        root /app/public;
        index index.php;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # 🔥 IMPORTANT : handler correct Symfony
        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;

            internal;
        }

        # 🔒 bloquer les autres .php
        location ~ \.php$ {
            return 404;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}