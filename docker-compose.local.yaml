version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: unless-stopped
  php:
    build:
      context: .
      dockerfile: Dockerfile
      #target: dev
    volumes:
      - .:/var/www/html
    env_file:
      - .env.local
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  cron:
    image: php:8.2-cli
    volumes:
      - .:/var/www/html
    entrypoint: ["sh", "-c", "echo '0 2 * * * php /var/www/bin/console app:update:user:need:scores >> /var/www/var/log/cron.log 2>&1' > /etc/crontabs/root && crond -f -l 8"]
    restart: unless-stopped


volumes:
  db_data:
  mongo_data:
