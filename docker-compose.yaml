version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: symfony_app
    ports:
      - "8080:80"
    env_file:
      - .env.local  
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
    command: >
      sh -c "php bin/console cache:warmup && apache2-foreground"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    container_name: symfony_db
    environment:
      MYSQL_ROOT_PASSWORD: gestuellegestuelle240419   # mot de passe root
      MYSQL_DATABASE: symfony_db                  
      MYSQL_USER: lhdls                   
      MYSQL_PASSWORD: rapiderapide419420
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:
